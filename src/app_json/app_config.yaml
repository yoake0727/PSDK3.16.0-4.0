# ============================================================
# 项目统一配置
#
# 说明：
#   - 格式为扁平 "key: value"，支持 "#" 注释
#   - 由 AppConfig / LoadYaml 解析，不支持嵌套、数组、引号
#   - 账号密码为明文，务必限制文件权限（chmod 600）且不要提交真实凭据
# ============================================================

# ---------- MQTT 连接 ----------
mqtt.host: 192.168.144.125          # Broker 地址
mqtt.port: 1883                      # Broker 端口（1883 明文，8883 TLS）
mqtt.keepalive: 60                   # 心跳间隔（秒）
mqtt.username: mqttuser              # MQTT 用户名
mqtt.password: mqtt                  # MQTT 密码（明文，需 chmod 600）
mqtt.client_id: M400_MANIFOLD3       # 客户端 ID（同一 Broker 必须唯一）
mqtt.drone_id: 1581FBDBW256500A2NXJ  # 无人机 ID（用于拼 topic）

# ---------- H30T 相机 ----------
h30t.mount: 3                        # 挂载口编号（1/2/3）
h30t.rtsp.url: rtsp://127.0.0.1:8554/h30t  # 本地 MediaMTX 转发地址
h30t.rtsp.transport: tcp             # RTSP 传输协议（tcp 稳，udp 延迟低）
h30t.rtsp.max_queue_bytes: 4194304   # 推流管线最大队列（4MB）

# ---------- YOLO 模型 ----------
yolo.model: /home/amov/AI_model/panel/best.engine   # TensorRT engine 路径
yolo.labels: /home/amov/AI_model/panel/labels.txt   # 标签文件路径
yolo.input_size: 640                 # 推理输入尺寸（越大越准越慢）
yolo.confidence: 0.45                # 置信度阈值（低于此值丢弃）
yolo.nms: 0.45                       # NMS 阈值（IoU 高于此值合并）

# ---------- MinIO 对象存储 ----------
minio.addr: 192.168.144.125:9000     # MinIO 地址（9000 API，9001 控制台）
minio.bucket: inspection             # 存储桶名（不存在自动创建）
minio.visible_folder: DroneFiles     # 可见光图片前缀
minio.infrared_folder: INF_images    # 红外图片前缀
minio.access_key: minioadmin         # Access Key（明文，需 chmod 600）
minio.secret_key: minioadmin          # Secret Key（占位符，必须改真实值）
minio.jpeg_quality: 90               # JPEG 质量（0~100，90 高质量）

# ---------- 目标高度 ----------
target_height_agl_m: 0.0             # 目标离地高度（地面目标填 0.0）

# ---------- SORT 跟踪参数 ----------
tracking.min_hits: 3                 # 连续命中 N 帧才输出（3 帧 ≈ 200ms）
tracking.max_age: 8                  # 丢失 N 帧后删除（8 帧 ≈ 533ms）
tracking.iou_threshold: 0.2          # IoU 匹配阈值（越大越严格）
tracking.center_distance_factor: 1.0 # 中心距离兜底系数（越大越宽松）

# ---------- 遥测匹配 ----------
telemetry.match_max_diff_ms: 500     # 帧与遥测最大时间差（ms，偏大）

# ---------- 可见光相机参数 ----------
visible.focal_length_mm: 7.1         # 焦距（mm）
visible.pixel_size_mm: 0.00097       # 像元尺寸（mm，0.97μm）
visible.image_width: 1440            # 图像宽度（像素）
visible.image_height: 1080           # 图像高度（像素）
visible.lever_arm.forward_m: 0.562439   # 可见光杆臂：前向（m）
visible.lever_arm.right_m: -0.504344    # 可见光杆臂：右向（m，负=西）
visible.lever_arm.down_m: 0.250245      # 可见光杆臂：下向（m）

# ---------- 红外相机参数 ----------
infrared.focal_length_mm: 24.0       # 红外焦距（mm，实际焦距）
infrared.pixel_size_mm: 0.012        # 红外像元间距（mm，12μm）
infrared.image_width: 1280           # 红外原生宽度（像素）
infrared.image_height: 1024          # 红外原生高度（像素）
infrared.lever_arm.forward_m: 0.562439  # 红外杆臂：前向（m）
infrared.lever_arm.right_m: -0.504344   # 红外杆臂：右向（m，负=西）
infrared.lever_arm.down_m: 0.250245     # 红外杆臂：下向（m）

# ---------- 离线视频测试 ----------
video.input_mode: local_file         # 输入模式（local_file / h30t）
video.file_path: /home/amov/test/input.mp4  # 本地视频路径
video.camera_source: h30t_infrared   # 模拟相机源（IR/ZOOM/WIDE）
video.loop: false                    # 是否循环播放